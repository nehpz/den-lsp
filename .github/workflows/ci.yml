name: CI & FlakeHub Publish
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - name: Run root flake check
        # --impure: the ephemeral wrapper tests evaluate fixture flakes via
        # builtins.getFlake on path: refs, which pure evaluation forbids.
        run: nix flake check --impure
      - name: Run server unit tests
        run: nix develop -c cargo test --manifest-path server/Cargo.toml
      - name: Run hermetic scenario check
        run: nix flake check "path:fixtures/scenarios" --override-input den-lsp "$PWD"
      - name: Run consumer fixture E2E
        run: fixtures/run-checks.bash
      - name: Run evidence runner unit tests
        run: |
          tools/evidence-runner/test-compare.bash
          tools/evidence-runner/test-report.bash
          tools/evidence-runner/test-run.bash
      - name: Run stub evidence sweep and readout gate
        # Blocking E2E leg: exercises the full runner loop over the clear-cut
        # corpus (including the eval-error scenarios' expectedError substring
        # assertion, which the hermetic tier structurally cannot check) and
        # gates on the readout's GO verdict.
        run: |
          tools/evidence-runner/run.bash --adapter stub --set clear-cut --out /tmp/ci-evidence-metrics.jsonl
          tools/evidence-runner/report.bash --in /tmp/ci-evidence-metrics.jsonl

  flakehub-publish:
    name: Publish to FlakeHub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-push@v6
        with:
          name: rzp/den-lsp
          rolling: true
          visibility: unlisted
          include-output-paths: true
