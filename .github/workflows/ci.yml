name: CI & FlakeHub Publish
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - name: Run root flake check
        run: nix flake check
      - name: Run hermetic scenario check
        run: nix flake check "path:fixtures/scenarios" --override-input den-lsp "$PWD"
      - name: Run consumer fixture E2E
        run: fixtures/run-checks.bash
      - name: Run evidence runner unit tests
        run: |
          tools/evidence-runner/test-compare.bash
          tools/evidence-runner/test-report.bash
          tools/evidence-runner/test-run.bash

  flakehub-publish:
    name: Publish to FlakeHub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - uses: DeterminateSystems/flakehub-push@v6
        with:
          name: rzp/den-lsp
          rolling: true
          visibility: unlisted
          include-output-paths: true
